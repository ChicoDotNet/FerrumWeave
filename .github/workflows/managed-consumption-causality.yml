name: Managed consumption causality oracle

# Historical/differential oracle only.
# This workflow intentionally does not run on every pull-request synchronize:
# passing it proves behavior through the pinned upstream backend, not through
# FerrumWeave's product codegen path. Run it explicitly when oracle replay adds
# diagnostic value or when its own characterization fixtures change on dev/main.
on:
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/managed-consumption-causality.yml"
      - "eng/verification/verify_managed_static_call_causality.py"
      - "tests/fixtures/managed_static_call.rs"
      - "docs/upstream/rustc_codegen_clr.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-consumption-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-causality-oracle:
    name: Oracle: Rust source → managed static call (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            backend: librustc_codegen_clr.so
            linker: linker
          - os: windows-latest
            backend: rustc_codegen_clr.dll
            linker: linker.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned characterization oracle
        uses: actions/checkout@v7.0.1
        with:
          repository: FractalFir/rustc_codegen_clr
          ref: a9aa553b136fce00eceb41fba30758830500a63f
          path: .managed-causality/rustc_codegen_clr
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Install pinned oracle toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2025-10-14 \
            --profile minimal \
            --component rust-src,rustc-dev,llvm-tools-preview
          rustc +nightly-2025-10-14 --version --verbose

      - name: Install IL assembler on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mono-devel
          ilasm --help >/dev/null || true

      - name: Build pinned oracle backend and linker
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2025-10-14 build \
            --release \
            --manifest-path .managed-causality/rustc_codegen_clr/Cargo.toml \
            --lib
          cargo +nightly-2025-10-14 build \
            --release \
            --manifest-path .managed-causality/rustc_codegen_clr/cilly/Cargo.toml \
            --bin linker

      - name: Replay source-causality characterization
        shell: bash
        run: |
          set -euo pipefail
          upstream="$GITHUB_WORKSPACE/.managed-causality/rustc_codegen_clr"
          python eng/verification/verify_managed_static_call_causality.py \
            --toolchain nightly-2025-10-14 \
            --backend "$upstream/target/release/${{ matrix.backend }}" \
            --linker "$upstream/target/release/${{ matrix.linker }}"
