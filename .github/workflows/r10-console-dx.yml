name: R10 console developer experience

on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'projection/**'
      - 'sdk/**'
      - 'eng/r10/**'
      - 'tests/r10/**'
      - '.github/workflows/r10-console-dx.yml'
  workflow_dispatch:

jobs:
  installed-console-run:
    name: installed console run (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install pinned Rust toolchain and compiler components
        shell: pwsh
        run: |
          rustup toolchain install nightly-2025-10-14 --profile minimal --component rustc-dev,rust-src,llvm-tools-preview

      - name: Exercise installed console run boundary
        shell: pwsh
        run: |
          ./eng/r10/Test-FerrumWeaveConsoleRun.ps1 -RepoRoot $PWD -WorkRoot "${{ runner.temp }}/ferrumweave-r10-console-dx"
