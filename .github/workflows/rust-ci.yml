name: Rust CI

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "compiler/**"
      - "projection/**"
      - "sdk/**"
      - "eng/verification/**"
      - "tests/**"
      - "tools/quality/**"
      - "docs/quality/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "compiler/**"
      - "projection/**"
      - "sdk/**"
      - "eng/verification/**"
      - "tests/**"
      - "tools/quality/**"
      - "docs/quality/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Formatting
        id: formatting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/quality
          cargo fmt --all
          git diff -- . > target/quality/rustfmt.diff
          if [[ -s target/quality/rustfmt.diff ]]; then
            cat target/quality/rustfmt.diff
            exit 1
          fi
      - name: Upload rustfmt diagnostic
        if: failure() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rustfmt-diagnostic
          path: |
            target/quality/rustfmt.diff
            compiler/cil/src/*.rs
          if-no-files-found: error
          retention-days: 3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.400"
      - name: Toolchain
        run: rustup show
      - name: Provision pinned rustc backend components
        run: rustup component add --toolchain nightly-2025-10-14 rustc-dev rust-src llvm-tools-preview
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Unit tests
        run: cargo test --workspace --lib --locked
      - name: Integration tests
        id: integration_tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/quality
          cargo test --workspace --tests --locked 2>&1 | tee "target/quality/integration-tests-${RUNNER_OS}.log"
      - name: Upload integration first-divergence log
        if: failure() && steps.integration_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: integration-first-divergence-${{ matrix.os }}
          path: target/quality/integration-tests-${{ runner.os }}.log
          if-no-files-found: error
          retention-days: 3

  code-coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.400"
      - name: Toolchain
        run: rustup show
      - name: Provision pinned rustc backend components
        run: rustup component add --toolchain nightly-2025-10-14 rustc-dev rust-src llvm-tools-preview
      - name: Install pinned cargo-llvm-cov
        shell: bash
        run: cargo install --locked --force --version 0.8.7 cargo-llvm-cov
      - name: Measure line coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/coverage
          cargo llvm-cov \
            --workspace \
            --all-targets \
            --locked \
            --json \
            --ignore-filename-regex '(^|/)tests/' \
            --output-path target/coverage/coverage.json
          python3 tools/quality/check_code_coverage.py \
            target/coverage/coverage.json \
            --minimum 80 \
            --preferred-maximum 96
          cargo llvm-cov report \
            --lcov \
            --ignore-filename-regex '(^|/)tests/' \
            --output-path target/coverage/lcov.info

  functional-coverage:
    name: functional coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.400"
      - name: Toolchain
        run: rustup show
      - name: Enforce functional contract coverage
        run: python3 tools/quality/check_functional_coverage.py
      - name: Enforce managed-consumption source causality
        run: python3 eng/verification/check_managed_consumption_causality.py
