name: R01 rustfmt

on:
  push:
    branches:
      - feat/r01-clr-artifact-probe
    paths:
      - "compiler/**/*.rs"
      - "tests/**/*.rs"
      - ".github/workflows/r01-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use repository toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all
      - name: Commit mechanical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "rustfmt produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler tests
          git commit -m "chore: apply rustfmt"
          git push
