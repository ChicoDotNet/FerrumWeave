name: R01 closeout

on:
  push:
    branches:
      - feat/r01-clr-artifact-probe
    paths:
      - ".github/workflows/r01-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Mark R01 certified
        shell: python
        run: |
          from pathlib import Path

          roadmap_path = Path("docs/roadmap/README.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          replacements = {
              "| R01 — CLR artifact probe | Next |": "| R01 — CLR artifact probe | **Done** |",
              "| R02 — Rust → CLR vertical slice | Planned |": "| R02 — Rust → CLR vertical slice | **Next** |",
              "# R01 — CLR artifact probe\n\n## Goal": "# R01 — CLR artifact probe\n\n**Status: Done.**\n\n## Goal",
          }
          for old, new in replacements.items():
              if old not in roadmap:
                  raise SystemExit(f"roadmap marker not found: {old}")
              roadmap = roadmap.replace(old, new, 1)
          roadmap_path.write_text(roadmap, encoding="utf-8")

          compatibility_path = Path("docs/compatibility/README.md")
          compatibility = compatibility_path.read_text(encoding="utf-8")
          old = "## R01 — CLR artifact probe\n\nR01's compatibility contract is intentionally small:"
          new = "## R01 — CLR artifact probe\n\n**Status: Certified in CI — 5/5 functional contracts, 96.21% Rust line coverage.**\n\nR01's compatibility contract is intentionally small:"
          if old not in compatibility:
              raise SystemExit("compatibility R01 marker not found")
          compatibility = compatibility.replace(old, new, 1)
          compatibility = compatibility.replace("| Capability | Linux | Windows | Expected R01 proof |", "| Capability | Linux | Windows | Certified R01 proof |", 1)
          compatibility_path.write_text(compatibility, encoding="utf-8")
      - name: Commit milestone closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/README.md docs/compatibility/README.md
          git commit -m "docs: mark R01 certified"
          git push
