name: R02 upstream probe

on:
  push:
    branches:
      - feat/r02-rust-clr-vertical-slice
    paths:
      - ".github/workflows/r02-upstream-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: upstream probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            backend: librustc_codegen_clr.so
            linker: linker
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            backend: rustc_codegen_clr.dll
            linker: linker.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: FractalFir/rustc_codegen_clr
          ref: a9aa553b136fce00eceb41fba30758830500a63f
          path: .r02/rustc_codegen_clr
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned upstream Rust toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2025-10-14 --profile minimal --component rust-src,rustc-dev,llvm-tools-preview
          rustc +nightly-2025-10-14 --version --verbose
      - name: Install IL assembler on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel
          ilasm --help >/dev/null || true
      - name: Build upstream backend and linker
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2025-10-14 build --release --manifest-path .r02/rustc_codegen_clr/Cargo.toml --lib
          cargo +nightly-2025-10-14 build --release --manifest-path .r02/rustc_codegen_clr/cilly/Cargo.toml --bin linker
      - name: Create minimal Rust source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r02/hello/src
          cat > .r02/hello/Cargo.toml <<'EOF'
          [package]
          name = "ferrumweave-r02-probe"
          version = "0.0.0"
          edition = "2021"
          EOF
          cat > .r02/hello/src/main.rs <<'EOF'
          fn main() {
              println!("Hello FerrumWeave");
          }
          EOF
      - name: Compile and execute real Rust through CLR backend
        shell: bash
        run: |
          set -euo pipefail
          upstream="$GITHUB_WORKSPACE/.r02/rustc_codegen_clr"
          backend="$upstream/target/release/${{ matrix.backend }}"
          linker="$upstream/target/release/${{ matrix.linker }}"
          test -f "$backend"
          test -f "$linker"
          export RUSTFLAGS="-Z codegen-backend=$backend -C linker=$linker -C link-args=--cargo-support"
          cargo +nightly-2025-10-14 run \
            --manifest-path .r02/hello/Cargo.toml \
            -Z build-std=core,alloc,std,panic_abort \
            --target ${{ matrix.target }}
