name: R02 upstream probe

on:
  push:
    branches:
      - feat/r02-rust-clr-vertical-slice
    paths:
      - ".github/workflows/r02-upstream-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: upstream probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            backend: librustc_codegen_clr.so
            linker: linker
          - os: windows-latest
            backend: rustc_codegen_clr.dll
            linker: linker.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: FractalFir/rustc_codegen_clr
          ref: a9aa553b136fce00eceb41fba30758830500a63f
          path: .r02/rustc_codegen_clr
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned upstream Rust toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2025-10-14 --profile minimal --component rust-src,rustc-dev,llvm-tools-preview
          rustc +nightly-2025-10-14 --version --verbose
      - name: Install IL assembler on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel
          ilasm --help >/dev/null || true
      - name: Build upstream backend and linker
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2025-10-14 build --release --manifest-path .r02/rustc_codegen_clr/Cargo.toml --lib
          cargo +nightly-2025-10-14 build --release --manifest-path .r02/rustc_codegen_clr/cilly/Cargo.toml --bin linker
      - name: Create minimal real Rust source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r02/out
          cat > .r02/r02.rs <<'EOF'
          #![feature(adt_const_params, core_intrinsics, unsized_const_params)]
          #![allow(incomplete_features, internal_features)]

          #[derive(Clone, Copy)]
          struct RustcCLRInteropManagedChar {
              size: u16,
          }

          #[inline(never)]
          fn rustc_clr_interop_managed_call0_<
              const ASSEMBLY: &'static str,
              const CLASS_PATH: &'static str,
              const IS_VALUETYPE: bool,
              const METHOD: &'static str,
              Ret,
          >() -> Ret {
              core::intrinsics::abort();
          }

          #[inline(never)]
          fn rustc_clr_interop_managed_call1_<
              const ASSEMBLY: &'static str,
              const CLASS_PATH: &'static str,
              const IS_VALUETYPE: bool,
              const METHOD: &'static str,
              const IS_STATIC: bool,
              Ret,
              Arg1,
          >(arg1: Arg1) -> Ret {
              let _ = arg1;
              core::intrinsics::abort();
          }

          fn write_char(value: u16) {
              let managed = unsafe {
                  core::mem::transmute::<u16, RustcCLRInteropManagedChar>(value)
              };
              rustc_clr_interop_managed_call1_::<
                  "System.Console",
                  "System.Console",
                  false,
                  "Write",
                  true,
                  (),
                  RustcCLRInteropManagedChar,
              >(managed);
          }

          fn main() {
              write_char('H' as u16);
              write_char('e' as u16);
              write_char('l' as u16);
              write_char('l' as u16);
              write_char('o' as u16);
              write_char(' ' as u16);
              write_char('F' as u16);
              write_char('e' as u16);
              write_char('r' as u16);
              write_char('r' as u16);
              write_char('u' as u16);
              write_char('m' as u16);
              write_char('W' as u16);
              write_char('e' as u16);
              write_char('a' as u16);
              write_char('v' as u16);
              write_char('e' as u16);
              rustc_clr_interop_managed_call0_::<
                  "System.Console",
                  "System.Console",
                  false,
                  "WriteLine",
                  (),
              >();
          }
          EOF
      - name: Compile real Rust through rustc and CLR backend
        shell: bash
        run: |
          set -euo pipefail
          upstream="$GITHUB_WORKSPACE/.r02/rustc_codegen_clr"
          backend="$upstream/target/release/${{ matrix.backend }}"
          linker="$upstream/target/release/${{ matrix.linker }}"
          test -f "$backend"
          test -f "$linker"
          rustc +nightly-2025-10-14 \
            -O \
            -Z "codegen-backend=$backend" \
            -C "linker=$linker" \
            --edition 2021 \
            -Ctarget-feature=+x87+sse \
            .r02/r02.rs \
            -o .r02/out/FerrumWeave.R02.exe
          test -f .r02/out/FerrumWeave.R02.exe
      - name: Execute managed artifact on CoreCLR
        shell: bash
        run: |
          set -euo pipefail
          cat > .r02/out/FerrumWeave.R02.runtimeconfig.json <<'EOF'
          {
            "runtimeOptions": {
              "tfm": "net8.0",
              "framework": {
                "name": "Microsoft.NETCore.App",
                "version": "8.0.0"
              }
            }
          }
          EOF
          output="$(dotnet .r02/out/FerrumWeave.R02.exe)"
          printf '%s\n' "$output"
          test "$output" = "Hello FerrumWeave"
