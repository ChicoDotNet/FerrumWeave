# R05 preserves the managed-metadata and IL-emission primitives already proven,
# but artifact-level emission is intentionally tracked separately from behavior
# caused by real Rust source. A family is not source-causally certified until a
# source-only mutation changes the managed observable through the FerrumWeave
# codegen backend. Upstream/oracle evidence is preserved but cannot certify a
# FerrumWeave product claim.
#
# Final re-certification baseline: exact SHA
# 60756627ca1617b517fbcbbb0654b1c2c23cb71b passed FerrumWeave codegen backend
# convergence #106 and Rust CI #469, including fmt, clippy, coverage, and
# Ubuntu/Windows build + unit + integration. The source-causal contracts below
# are FerrumWeave-backend-proven; rustc_codegen_clr remains oracle evidence only.

[[contracts]]
id = "FW-R05-DOTNET-001"
family = "resolve and call a public static .NET method through managed metadata"
implemented = true
evidence_level = "artifact-proven"
proof = "tests/managed_static_call_emission.rs resolves System.Console.WriteLine to a CLR MemberRef token and verifies emitted managed IL calls that exact token; this proves the emission primitive, not Rust-source causality"

