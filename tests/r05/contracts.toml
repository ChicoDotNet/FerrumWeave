milestone = "R05"
status = "done"
minimum_percent_when_done = 96.0
target_percent_when_done = 100.0

# R05 declares the managed-consumption denominator before implementation.
# Contracts remain false until executable evidence proves the corresponding
# Rust -> managed metadata capability; CI must not treat declarations as proof.

[[contracts]]
id = "FW-R05-DOTNET-001"
family = "resolve and call a public static .NET method through managed metadata"
implemented = true
proof = "tests/r05_static_call.rs resolves System.Console.WriteLine to a CLR MemberRef token and verifies Rust-emitted managed IL calls that exact token; Rust CI certified Ubuntu and Windows"

[[contracts]]
id = "FW-R05-DOTNET-002"
family = "construct a supported public .NET type"
implemented = true
proof = "tests/r05_construct.rs resolves System.Object::.ctor to a CLR MemberRef token and verifies Rust-emitted managed IL uses newobj with that exact token; Rust CI #109 certified Ubuntu and Windows and R04 CLR CTS Reflection #21 remained GREEN"

[[contracts]]
id = "FW-R05-DOTNET-003"
family = "call a supported public instance method"
implemented = true
proof = "tests/r05_instance_call.rs resolves System.Object.ToString to a CLR MemberRef token and verifies Rust-emitted managed IL uses callvirt with that exact token; Rust CI #117 certified fmt/clippy, functional/code coverage, Ubuntu and Windows and R04 CLR CTS Reflection #29 remained GREEN"

[[contracts]]
id = "FW-R05-DOTNET-004"
family = "read and write a supported public property"
implemented = true
proof = "tests/r05_property.rs resolves System.Environment.CurrentDirectory getter/setter MemberRefs and verifies Rust-emitted managed IL calls both exact tokens; Rust CI #127 certified fmt/clippy, functional/code coverage, Ubuntu and Windows and R04 CLR CTS Reflection #39 remained GREEN"

[[contracts]]
id = "FW-R05-DOTNET-005"
