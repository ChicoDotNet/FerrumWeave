# R07 turns mechanical CLR interoperability into explicit cross-runtime semantics.
# The denominator is declared up front from the roadmap and inherited R04/R06 boundaries.
# A contract remains false until executable evidence proves the supported behavior; ADRs and
# compatibility documentation are milestone DoD evidence but do not substitute for execution.

[[contracts]]
id = "FW-R07-SEM-001"
family = "Option<T> Some for a supported managed reference preserves the managed value/identity at the CLR boundary"
implemented = true
proof = "tests/r07_option_reference.rs builds and executes an independent net10.0 C# consumer against the Rust-emitted managed assembly; FerrumWeave.RustApi.OptionSomeString() is emitted in compiler/cil/src/r06.rs as managed IL ldstr 'FerrumWeave'; ret and preserves the expected managed reference value. Rust CI #173 certified integration tests on Ubuntu and Windows for exact product SHA deeee2b684dd98facbd3356460ef4113244ee468; code coverage, fmt/clippy, functional coverage, and emitted-assembly reflection were also GREEN."

[[contracts]]
id = "FW-R07-SEM-002"
family = "Option<T> None for a supported managed reference projects to explicit CLR null semantics"
implemented = true
proof = "tests/r07_option_reference.rs builds and executes an independent net10.0 C# consumer against the Rust-emitted managed assembly; FerrumWeave.RustApi.OptionNoneString() is emitted in compiler/cil/src/r06.rs as managed IL ldnull; ret and the CLR consumer observes null explicitly. Rust CI #173 certified integration tests on Ubuntu and Windows for exact product SHA deeee2b684dd98facbd3356460ef4113244ee468; code coverage, fmt/clippy, functional coverage, and emitted-assembly reflection were also GREEN."

[[contracts]]
id = "FW-R07-SEM-003"
family = "Option<T> for a supported CLR value type uses an explicit System.Nullable<T> projection for Some and None"
implemented = true
proof = "tests/r07_option_value.rs builds and executes an independent net10.0 C# consumer against the Rust-emitted managed assembly. FerrumWeave.RustApi.OptionSomeI32() returns System.Nullable<int> constructed by managed IL newobj against a TypeSpec-bound System.Nullable`1 constructor with VAR 0, while OptionNoneI32() returns the default Nullable<int> through managed ldnull + unbox.any. Rust CI #178 certified the exact product SHA fbb53f6741d3d3b02f9040d15540f5918516bcb8 GREEN for fmt/clippy, functional coverage, code coverage, and integration tests on Ubuntu and Windows; R04 CLR CTS Reflection #85 was also GREEN."

[[contracts]]
id = "FW-R07-SEM-004"
family = "Result<T, E> success crosses a supported public CLR boundary as the declared success value"
implemented = true
proof = "tests/r07_result_success.rs builds and executes an independent net10.0 C# consumer against the Rust-emitted managed assembly and observes FerrumWeave.RustApi.ResultOkI32() == 42. The behavior is emitted as managed IL by compiler/cil/src/r06.rs; the C# harness only consumes the public CLR contract. Rust CI #182 certified exact product SHA 1efc849ace95bfe04d069ac8cd2a94e1e6bec258 GREEN for fmt/clippy, functional coverage, code coverage, and integration tests on Ubuntu and Windows; R04 CLR CTS Reflection #89 was also GREEN."

[[contracts]]
id = "FW-R07-SEM-005"
family = "Result<T, E> failure crosses a supported public CLR boundary as a coherent managed exception rather than a hidden status-code convention"
implemented = true
proof = "tests/r07_result_failure.rs builds and executes an independent net10.0 C# consumer against the Rust-emitted managed assembly. FerrumWeave.RustApi.ResultErrI32() is emitted in compiler/cil/src/r06.rs as managed IL that loads the stable message, constructs System.InvalidOperationException(string), and throws it; the C# harness only consumes the public CLR contract and observes the exact message 'FerrumWeave Result error'. Rust CI #189 certified exact product SHA 9d9f003e93f99de96feca18f0b2d11e39705e1e0 GREEN for fmt/clippy, functional coverage, 92.54% code coverage, and integration tests on Ubuntu and Windows; R04 CLR CTS Reflection #96 was also GREEN on Linux and Windows."

[[contracts]]
id = "FW-R07-SEM-006"
family = "panic behavior at a supported managed public boundary follows an explicit policy and does not silently unwind across an unsupported runtime boundary"
implemented = true
proof = "projection/types/tests/panic_boundary_policy.rs exercises FerrumWeave's Rust-side managed-boundary policy directly: managed_panic_boundary_policy() returns RejectUncontainedPanic, reports that CLR-boundary unwind is not permitted, and exposes a stable diagnostic requiring panic containment or explicit failure modeling. Rust CI #193 certified exact product SHA 860b74a81bba08f0bbc09d72f433e9ced1f27142 GREEN for fmt/clippy, functional coverage, 92.57% code coverage, and integration tests on Ubuntu and Windows; R04 CLR CTS Reflection #100 was also GREEN on Linux and Windows."

[[contracts]]
id = "FW-R07-SEM-007"
family = "a supported Rust Drop/RAII resource projects to IDisposable-style cleanup with exactly-once observable release semantics"
implemented = true
proof = "compiler/cil/src/r07.rs emits a dedicated IL-only managed FerrumWeave.RustResource class implementing System.IDisposable with private per-instance releaseCount state, public constructor, idempotent Dispose(), and ReleaseCount(). tests/r07_disposable.rs builds and executes an independent net10.0 C# consumer, verifies the IDisposable cast, and observes logical release counts 0 -> 1 -> 1 before cleanup, after first Dispose, and after repeated Dispose. Rust CI #201 certified exact product SHA 4d1187c1281eae9c578db01183b60e1f241580ac GREEN for fmt/clippy, functional coverage, 93.26% line coverage, and integration tests on Ubuntu and Windows; R04 CLR CTS Reflection #108 was also GREEN on Linux and Windows."

[[contracts]]
id = "FW-R07-SEM-008"
family = "supported managed ownership/GC lifetime preserves identity without duplicate release or invalid access after release in supported scenarios"
implemented = true
proof = "tests/r07_managed_identity.rs builds and executes an independent net10.0 C# consumer against the Rust-emitted FerrumWeave.RustResource. Two managed aliases are ReferenceEquals-identical, disposing through either alias updates the same per-instance release state exactly once, repeated Dispose through the other alias remains idempotent, ReleaseCount remains safely observable after release, and GC.KeepAlive preserves both references through the observation. Exact SHA 92384d62af1cd308c6670f05a895d124eac0fe83 was GREEN in Rust CI on Ubuntu and Windows, code coverage, fmt/clippy, functional coverage, and emitted-assembly reflection on Linux and Windows."

[[contracts]]
id = "FW-R07-SEM-009"
family = "at least one supported generic boundary has a coherent Rust/CTS representation observable by CLR consumers"
implemented = true
proof = "tests/r07_generic_boundary.rs loads the Rust-emitted assembly in an independent net10.0 CLR consumer and uses System.Reflection to verify that OptionSomeI32 and OptionNoneI32 expose a genuine generic return type whose generic definition is System.Nullable<> and whose sole generic argument is System.Int32. Exact SHA 9079dcf41dbe8bf9387b5f552ece4f12ef2b351a was GREEN in Rust CI #205 and R04 CLR CTS Reflection #112, including Ubuntu/Windows integration certification."

[[contracts]]
id = "FW-R07-SEM-010"
family = "Rust borrow/lifetime semantics that cannot safely escape a managed boundary are rejected explicitly rather than erased into GC reachability"
implemented = true
proof = "projection/types/tests/borrow_lifetime_boundary.rs exercises the Rust-side projection contract for both SharedBorrow and ExclusiveBorrow. managed_object_mapping(...) rejects each borrowed shape as Unsupported, preserves the rejected ManagedObjectSource in the diagnostic, and emits stable rationale that CLR managed references preserve reachability/identity but do not encode Rust borrow/lifetime guarantees. Exact SHA a1f919605933d75364b331672a0894b8a8220241 was GREEN in Rust CI #207 and R04 CLR CTS Reflection #114, including Ubuntu/Windows integration certification."

