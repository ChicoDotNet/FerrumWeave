# R07 turns mechanical CLR interoperability into explicit cross-runtime semantics.
# The denominator is declared up front from the roadmap and inherited R04/R06 boundaries.
# A contract remains false until executable evidence proves the supported behavior; ADRs and
# compatibility documentation are milestone DoD evidence but do not substitute for execution.
# 2026-09 backend-convergence audit: product claims require Rust source -> rustc -> FerrumWeave
# CodegenBackend causal evidence. Historical emitter evidence remains characterization only.

[[contracts]]
id = "FW-R07-SEM-001"
family = "Option<T> Some for a supported managed reference preserves the managed value/identity at the CLR boundary"
implemented = true
proof = "tests/r07_option_reference.rs builds real Rust Option<&'static str> source through .rsproj -> rustc -> FerrumWeave CodegenBackend -> FerrumWeave MIR lowering -> FerrumWeave CIL/metadata, then executes an independent net10.0 C# consumer on CoreCLR. The certifier mutates only the Rust Some payload from FerrumWeave to FerrumWeave-mutated and requires both managed artifact bytes and the CLR observable to change. Exact SHA 47d83fd2b27c77f8ee5f662860866494c5a6d33d was GREEN in Rust CI #508 and FerrumWeave codegen backend convergence #145, with R02 #184, R03 #211 and R04 #360 also GREEN."

