# R10 owns the installed-package developer experience for Rust as a language
# choice in standard .NET template families. Historical R08 evidence for
# `dotnet new rust` remains history; it is not the R10 public target.
#
# This ledger is intentionally independent from tests/functional/contracts.toml.
# Declaring an R10 contract here does not lower the existing functional coverage
# percentage while the milestone is still RED.

[[contracts]]
id = "FW-R10-DIST-001"
family = "FerrumWeave.Sdk installs and builds an external Rust console from a NuGet package"
implemented = true
proof = "GREEN. eng/r10/Test-FerrumWeaveSdkDistribution.ps1 and the R10 installed distribution workflow pack FerrumWeave.Sdk 0.1.0-alpha.1, install it by package ID/version from an isolated local feed, scaffold 'dotnet new console -lang Rust' outside the repository, and build with MSBuildSDKsPath unset and the repository fallback poisoned. The verifier asserts the package carries the MSBuild SDK, Rust console template, and backend source closure; then a Rust-only mutation 137 -> 211 must change the managed DLL hash and an independent CoreCLR reflection consumer observable. Certified on both Ubuntu and Windows. This remains distribution/build evidence only; FW-R10-DX-003 stays RED until the generated console itself provides the required direct 'dotnet run' Rust-source-causal observable."

[[contracts]]
id = "FW-R10-DX-003"
family = "installed alpha registers Rust as a .NET console-template language"
implemented = true
proof = "GREEN at exact candidate SHA 278044e80ae0fdc9c5a1c7265e4fe38abe66ef4a. R10 console developer experience #14 (run 35181282022) passed on both Ubuntu and Windows through the installed FerrumWeave.Sdk 0.1.0-alpha.1 package boundary in an external directory with repository fallback poisoned and MSBuildSDKsPath unset. The verifier preserved ordinary Rust fn main, observed 137, mutated only Rust source 137 -> 211, rebuilt through .rsproj -> FerrumWeave.Sdk -> rustc -> FerrumWeave CodegenBackend -> managed CIL/metadata, observed 211 from an independent CoreCLR consumer, resolved Assembly.EntryPoint / the CLI entry token to HelloFerrum.Program.Main, observed static int Program.Main() = 211, and then 'dotnet run' propagated Rust-source-causal process exit 211. The installed Rust console language coexisted with C#, Visual Basic, and F# console scaffolding. Exact-SHA companion gates were also GREEN: R10 installed distribution #15 (35181282024), Rust CI #848 (35181282122; Windows, Ubuntu, fmt/clippy, and coverage), FerrumWeave codegen backend convergence #482 (35181282129), .NET consumer interoperability #22 (35181282047), R04 CLR CTS Reflection #609 (35181282056), and Documentation graph CI #81 (35181282080). No generated per-project C#, native sidecar, legacy emitter, rustc_codegen_clr, repository-relative fallback, or MSBuildSDKsPath substitution supplied the observable."

[[contracts]]
id = "FW-R10-CLR-ENTRY-001"
family = "ordinary Rust main projects to a real managed .NET executable entry point"
implemented = true
proof = "GREEN at exact candidate SHA 278044e80ae0fdc9c5a1c7265e4fe38abe66ef4a. R10 console developer experience #14 (run 35181282022) passed on Ubuntu and Windows. The generated source retained ordinary Rust fn main and routed std::process::exit(answer()); FerrumWeave used the rustc-resolved semantic entry rather than textual main discovery. The independent CoreCLR reflection probe required Assembly.EntryPoint (the PE/CLI entry-point token) to resolve to HelloFerrum.Program.Main, required Main to be static int Main() with zero parameters, and observed Main() = 211 after the verifier mutated only Rust source from 137 to 211. Direct 'dotnet run' then propagated process exit 211 on both operating systems, proving the path Rust answer() -> managed FerrumWeave.RustApi.Answer() -> managed Program.Main() -> CLI entry token -> CoreCLR. Exact-SHA Rust CI #848 (35181282122), installed distribution #15 (35181282024), codegen convergence #482 (35181282129), .NET consumer interoperability #22 (35181282047), R04 #609 (35181282056), and Documentation graph CI #81 (35181282080) were GREEN. No generated C#, native sidecar, legacy emitter, arbitrary-export shortcut, upstream oracle, repository-relative fallback, or MSBuildSDKsPath substitution was accepted as evidence. Exact Result/error and args semantics remain separate contracts."

[[contracts]]
id = "FW-R10-CLR-SURFACE-001"
family = "Rust modules and exported items project to stable namespace-qualified CLR identities"
implemented = false
proof = "RED / pending. ADR 0005 defines the general projection rule; ADR 0006 defines naming uniqueness and visibility derivation. Project/root identity must deterministically provide AssemblyName and RootNamespace; semantic Rust module paths project to CLR namespace segments; CLR-exportable public Rust types project under those namespaces; supported Rust members project to normal CLR members with deterministic .NET-facing names while Rust source naming and rustc semantics remain unchanged. Acceptance must include at least one nested module and multiple projected types (for example HelloFerrum.Controllers.ApiDeClima, ServicioDeClima, RepositorioDeClima, and ContextoDbDeClima) discovered and consumed from an independent .NET project. A long-term application surface consisting only of synthetic FerrumWeave.RustApi exports is not sufficient proof."

[[contracts]]
id = "FW-R10-CLR-NAMING-001"
family = "Rust source identities project to deterministic cross-language-safe CLR names without silent collisions"
implemented = false
proof = "RED / pending. ADR 0006 is authoritative. Rust source naming remains valid Rust and is not rewritten to imitate C#. The rustc-resolved semantic entry point projects to the accepted managed Main facade rather than being found by textual name scanning. Snake-case modules/members receive deterministic .NET-facing names; raw identifier escape syntax does not leak into CLR names. Public projection must reject case-insensitive collisions, keyword/interoperability ambiguity, transformation-induced collisions, and collisions with reserved FerrumWeave generated identities instead of silently suffixing or hashing public APIs. Acceptance must include independent C#, Visual Basic, and F# consumers addressing the same projected identities unambiguously."

[[contracts]]
id = "FW-R10-CLR-VISIBILITY-001"
family = "effective Rust visibility projects to non-widening CLR accessibility"
implemented = false
proof = "RED / pending. ADR 0006 is authoritative and amends ADR 0005's earlier broad visibility wording. An exportable Rust item that rustc determines is effectively externally reachable projects to CLR Public by default; syntactic pub hidden behind a private ancestor must not become CLR public merely because of its declaration token, while public re-exports must honor their effective visibility. pub(crate) maps to CLR Assembly/internal by default. pub(super), pub(in ...), and private items remain non-public implementation and must never be widened into external CLR API. Any explicit CLR accessibility override may narrow Rust-authorized accessibility but must not widen it. CLR Family/protected-family access is emitted only under an explicit managed inheritance projection and is never inferred from Rust module visibility."

[[contracts]]
id = "FW-R10-WEB-HOST-001"
family = "web and webapi share a Rust-source-causal ASP.NET Core hosting foundation"
implemented = false
proof = "RED / pending. docs/roadmap/r10-web-hosting-handoff.md defines the current interface-first direction. Reuse the certified R07 CLR InterfaceImpl capability rather than hard-coding WebApplication convenience methods. Microsoft.AspNetCore.Hosting.IStartup is the first candidate seam, not a public syntax commitment; another official hosting seam may replace it if a causal RED proves it requires less new FerrumWeave semantics. T1 evidence requires normal ASP.NET Core/Kestrel hosting, an independent HTTP request, a response whose application-specific observable is owned by Rust source, Rust-only mutation changing both managed artifact and HTTP observable, Windows/Linux evidence, and no generated per-project C# substitute. The shared host/bootstrap must remain application-agnostic so both web and webapi can consume it without creating separate runtime stacks."

[[contracts]]
id = "FW-R10-TPL-WEBAPI-001"
family = "ASP.NET Core Web API participates as the Rust language variant of the standard webapi template"
implemented = false
proof = "RED / staged. T0 requires repository-local 'dotnet new webapi -lang Rust' scaffolding under the standard Microsoft.Web.WebApi group while preserving the built-in C# and F# variants. T1 depends on FW-R10-WEB-HOST-001 and remains required before support can be claimed. The generated project must start ASP.NET Core/Kestrel, answer a real API request (for example /health) with a deterministic Rust-source-causal response, mutate that observable when only Rust source changes, and pass Windows/Linux certification through the distributable package boundary. Direct Rust-facing WebApplication/Minimal API ergonomics are T2, not a prerequisite for T1. T0 scaffolding alone is not release proof."
