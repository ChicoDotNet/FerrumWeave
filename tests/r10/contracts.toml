# R10 owns the installed-package developer experience for Rust as a language
# choice in standard .NET template families. Historical R08 evidence for
# `dotnet new rust` remains history; it is not the R10 public target.
#
# This ledger is intentionally independent from tests/functional/contracts.toml.
# Declaring an R10 contract here does not lower the existing functional coverage
# percentage while the milestone is still RED.

[[contracts]]
id = "FW-R10-DIST-001"
family = "FerrumWeave.Sdk installs and builds an external Rust console from a NuGet package"
implemented = true
proof = "GREEN. eng/r10/Test-FerrumWeaveSdkDistribution.ps1 and the R10 installed distribution workflow pack FerrumWeave.Sdk 0.1.0-alpha.1, install it by package ID/version from an isolated local feed, scaffold 'dotnet new console -lang Rust' outside the repository, and build with MSBuildSDKsPath unset and the repository fallback poisoned. The verifier asserts the package carries the MSBuild SDK, Rust console template, and backend source closure; then a Rust-only mutation 137 -> 211 must change the managed DLL hash and an independent CoreCLR reflection consumer observable. Certified on both Ubuntu and Windows. This remains distribution/build evidence only; FW-R10-DX-003 stays RED until the generated console itself provides the required direct 'dotnet run' Rust-source-causal observable."

[[contracts]]
id = "FW-R10-DX-003"
family = "installed alpha registers Rust as a .NET console-template language"
implemented = false
proof = "RED / pending. From a clean external environment with the supported .NET SDK and FerrumWeave installed through its distributable package boundary, 'dotnet new console -lang Rust -n HelloFerrum' must generate an SDK-style .rsproj and src/main.rs; dotnet build/run must reach .rsproj -> FerrumWeave.Sdk -> rustc -> FerrumWeave CodegenBackend -> managed CIL/metadata -> CoreCLR with a Rust-source-causal observable. Installation must coexist with ordinary console, VB, and F# template variants. Direct execution additionally depends on FW-R10-CLR-ENTRY-001: ordinary Rust main must project to a valid managed static Program.Main plus the CLI entry-point MethodDef rather than promoting an unrelated export. Repository-local template installation, 'dotnet new rust', generated C#, legacy emitters, native sidecars, and rustc_codegen_clr are not valid proof of this contract."

[[contracts]]
id = "FW-R10-CLR-ENTRY-001"
family = "ordinary Rust main projects to a real managed .NET executable entry point"
implemented = false
proof = "RED / pending. ADR 0005 defines the source/CLR identity boundary. Rust source remains ordinary Rust and keeps fn main; FerrumWeave must project executable .rsproj output to a managed <RootNamespace>.Program.Main adapter that is static and whose MethodDef is designated as the PE/CLI entry point. The portable managed artifact remains <AssemblyName>.dll; a normal SDK/apphost may additionally produce HelloFerrum.exe on Windows or HelloFerrum on Unix. dotnet run must execute Rust-source-causal main behavior on Linux and Windows with no generated C#, native sidecar, legacy emitter, or upstream oracle substitution. Exact Result/error and args semantics remain separate explicit contracts."

[[contracts]]
id = "FW-R10-CLR-SURFACE-001"
family = "Rust modules and exported items project to stable namespace-qualified CLR identities"
implemented = false
proof = "RED / pending. ADR 0005 defines the general projection rule. Project/root identity must deterministically provide AssemblyName and RootNamespace; semantic Rust module paths project to CLR namespace segments; CLR-exportable public Rust types project under those namespaces; supported Rust members project to normal CLR members with deterministic .NET-facing names while Rust source naming and rustc semantics remain unchanged. Acceptance must include at least one nested module and multiple projected types (for example HelloFerrum.Controllers.ApiDeClima, ServicioDeClima, RepositorioDeClima, and ContextoDbDeClima) discovered and consumed from an independent .NET project. A long-term application surface consisting only of synthetic FerrumWeave.RustApi exports is not sufficient proof."

[[contracts]]
id = "FW-R10-WEB-HOST-001"
family = "web and webapi share a Rust-source-causal ASP.NET Core hosting foundation"
implemented = false
proof = "RED / pending. docs/roadmap/r10-web-hosting-handoff.md defines the current interface-first direction. Reuse the certified R07 CLR InterfaceImpl capability rather than hard-coding WebApplication convenience methods. Microsoft.AspNetCore.Hosting.IStartup is the first candidate seam, not a public syntax commitment; another official hosting seam may replace it if a causal RED proves it requires less new FerrumWeave semantics. T1 evidence requires normal ASP.NET Core/Kestrel hosting, an independent HTTP request, a response whose application-specific observable is owned by Rust source, Rust-only mutation changing both managed artifact and HTTP observable, Windows/Linux evidence, and no generated per-project C# substitute. The shared host/bootstrap must remain application-agnostic so both web and webapi can consume it without creating separate runtime stacks."

[[contracts]]
id = "FW-R10-TPL-WEBAPI-001"
family = "ASP.NET Core Web API participates as the Rust language variant of the standard webapi template"
implemented = false
proof = "RED / staged. T0 requires repository-local 'dotnet new webapi -lang Rust' scaffolding under the standard Microsoft.Web.WebApi group while preserving the built-in C# and F# variants. T1 depends on FW-R10-WEB-HOST-001 and remains required before support can be claimed. The generated project must start ASP.NET Core/Kestrel, answer a real API request (for example /health) with a deterministic Rust-source-causal response, mutate that observable when only Rust source changes, and pass Windows/Linux certification through the distributable package boundary. Direct Rust-facing WebApplication/Minimal API ergonomics are T2, not a prerequisite for T1. T0 scaffolding alone is not release proof."
