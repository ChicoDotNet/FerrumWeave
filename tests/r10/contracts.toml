# R10 owns the installed-package developer experience for Rust as a language
# choice in standard .NET template families. Historical R08 evidence for
# `dotnet new rust` remains history; it is not the R10 public target.
#
# This ledger is intentionally independent from tests/functional/contracts.toml.
# Declaring an R10 contract here does not lower the existing functional coverage
# percentage while the milestone is still RED.

[[contracts]]
id = "FW-R10-DX-003"
family = "installed alpha registers Rust as a .NET console-template language"
implemented = false
proof = "RED / pending. From a clean external environment with the supported .NET SDK and FerrumWeave installed through its distributable package boundary, 'dotnet new console -lang Rust -n HelloFerrum' must generate an SDK-style .rsproj and src/main.rs; dotnet build/run must reach .rsproj -> FerrumWeave.Sdk -> rustc -> FerrumWeave CodegenBackend -> managed CIL/metadata -> CoreCLR with a Rust-source-causal observable. Installation must coexist with ordinary console, VB, and F# template variants. Repository-local template installation, 'dotnet new rust', generated C#, legacy emitters, native sidecars, and rustc_codegen_clr are not valid proof of this contract."

[[contracts]]
id = "FW-R10-TPL-WEBAPI-001"
family = "ASP.NET Core Web API participates as the Rust language variant of the standard webapi template"
implemented = false
proof = "RED / staged. T0 requires repository-local 'dotnet new webapi -lang Rust' scaffolding under the standard Microsoft.Web.WebApi group while preserving the built-in C# and F# variants. T1 remains required before support can be claimed. The preferred first T1 seam is interface-first: generalize the already certified Rust-source-causal CLR InterfaceImpl path (R07 Drop -> System.IDisposable) toward the stable ASP.NET Core hosting contract, with Microsoft.AspNetCore.Hosting.IStartup as the first candidate because .NET 10 still defines ConfigureServices(IServiceCollection) and Configure(IApplicationBuilder) and supports UseStartup<TStartup>. A FerrumWeave-owned managed entry point/host bridge may provide reusable hosting infrastructure, but generated C# may not substitute for Rust application behavior. The generated project must start ASP.NET Core/Kestrel, answer a real HTTP request with a Rust-source-causal response, mutate that observable when only Rust source changes, and pass Windows/Linux certification through the distributable package boundary. Direct Rust-facing WebApplication/Minimal API ergonomics are T2, not a prerequisite for T1. T0 scaffolding alone is not release proof."