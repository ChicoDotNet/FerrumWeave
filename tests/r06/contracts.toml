# R06 declares the reverse managed-interoperability denominator before implementation.
# Contracts remain false until executable evidence proves that ordinary .NET consumers
# can use Rust-defined managed APIs. Consumer projects may be C#/VB test fixtures, but
# they must not reimplement the Rust-defined behavior under test.

[[contracts]]
id = "FW-R06-DOTNET-001"
family = "Rust produces a managed assembly exposing a coherent public static Rust-defined API"
implemented = true
proof = "compiler/cil/src/r06.rs emits FerrumWeave.RustApi.Answer() as public static int32 with a Rust-built ECMA-335 TypeDef/MethodDef and IL body ldc.i4.s 42; ret; Rust CI #148 certified the exact implementation on Ubuntu and Windows"

[[contracts]]
id = "FW-R06-DOTNET-002"
family = "a C# project references the Rust-produced managed assembly and calls supported public static Rust-defined behavior"
implemented = true
proof = "tests/r06_csharp_static.rs builds an independent net10.0 C# executable that references FerrumWeave.Probe.dll, calls FerrumWeave.RustApi.Answer(), executes under CoreCLR, and asserts stdout 42; Rust CI #148 integration tests passed on Ubuntu and Windows"

[[contracts]]
id = "FW-R06-DOTNET-003"
family = "a Visual Basic .NET project references the Rust-produced managed assembly and calls supported public static Rust-defined behavior"
implemented = true
proof = "tests/r06_vb_static.rs builds an independent net10.0 VB.NET executable that references FerrumWeave.Probe.dll, calls FerrumWeave.RustApi.Answer(), executes under CoreCLR, and asserts stdout 42; Rust CI #150 certified fmt/clippy, code/functional coverage, Ubuntu and Windows and R04 CLR CTS Reflection #59 remained GREEN"

[[contracts]]
id = "FW-R06-DOTNET-004"
family = "Rust produces a managed public type with a supported instance-call shape"
implemented = true
proof = "compiler/cil/src/r06.rs emits public FerrumWeave.RustValue : System.Object with a managed public .ctor() that calls System.Object::.ctor() and a public instance int32 Answer() IL body returning 42; Rust CI #154 certified the exact SHA on Ubuntu and Windows with 92.00% Rust line coverage and R04 CLR CTS Reflection #63 GREEN"

[[contracts]]
id = "FW-R06-DOTNET-005"
