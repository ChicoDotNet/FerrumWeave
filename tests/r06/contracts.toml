# R06 declares the reverse managed-interoperability denominator before implementation.
# Contracts remain false until executable evidence proves that ordinary .NET consumers
# can use Rust-defined managed APIs. Consumer projects may be C#/VB test fixtures, but
# they must not reimplement the Rust-defined behavior under test.
#
# Re-certification rule: historical artifact-level proofs remain useful evidence, but a
# product claim is source-causal only when Rust source flows through rustc and the
# FerrumWeave CodegenBackend into the managed artifact consumed by .NET. Static C#/VB
# and C#/VB instance contracts below now meet that stronger rule. Reflection and full
# native-ABI contracts remain historical until replayed through the same owned path.

[[contracts]]
id = "FW-R06-DOTNET-001"
family = "Rust produces a managed assembly exposing a coherent public static Rust-defined API"
implemented = true
proof = "FerrumWeave.Sdk builds real Rust source through rustc -Z codegen-backend=<FerrumWeave>; FerrumWeave MIR lowering emits FerrumWeave.RustApi.Answer() into RustLibrary.dll with crate-owned CLR assembly identity. Rust-only mutation 137 -> 211 changes the managed artifact and observable. Exact SHA 55caa43cdc93ac18139ac5e47205d0bf607043f5 passed Backend convergence #115 and Rust CI #478 on Ubuntu and Windows."

[[contracts]]
id = "FW-R06-DOTNET-002"
family = "a C# project references the Rust-produced managed assembly and calls supported public static Rust-defined behavior"
implemented = true
proof = "tests/r06_csharp_static.rs builds RustLibrary.rsproj through FerrumWeave.Sdk, then an independent net10.0 C# executable references RustLibrary.dll and calls FerrumWeave.RustApi.Answer(). The certifier mutates only Rust source 137 -> 211 and requires both assembly bytes and C# stdout to change. Exact SHA d9996458e48023562b434c5b2211e7b2936b9ca7 passed Rust CI #477 and Backend convergence #114 on Ubuntu and Windows; no r06 emitter, ferrumweave_emit, native ABI, or baked consumer behavior participates."

