# R08 makes Rust a first-class SDK-style project in the dotnet toolchain.
# The denominator is declared up front from the roadmap DoD. A contract remains false
# until executable evidence proves the supported behavior on the required platforms.

[[contracts]]
id = "FW-R08-SDK-001"
family = "dotnet new rust creates a structurally valid Rust/.NET project"
implemented = true
proof = "tests/r08_dotnet_new.rs installs the repository template through the real dotnet template engine, creates HelloFerrum with 'dotnet new rust', and verifies the generated .rsproj and Rust source. Certified on Linux and Windows by Rust CI #220 at d294ce796e81372ab49db36cc7f526d840410f01."

[[contracts]]
id = "FW-R08-SDK-002"
family = ".rsproj is an SDK-style project owned by FerrumWeave.Sdk"
implemented = true
proof = "sdk/templates/rust/HelloFerrum.rsproj names FerrumWeave.Sdk as its MSBuild SDK, while sdk/FerrumWeave.Sdk/Sdk/Sdk.props and Sdk.targets provide the repository-owned SDK boundary and delegate the standard .NET lifecycle to Microsoft.NET.Sdk. Certified by tests/r08_restore.rs on Linux and Windows in Rust CI #225 at 8cdd02e2d1d0cdf7f06b580b21c5c6ebe8ec369d."

[[contracts]]
id = "FW-R08-SDK-003"
family = "dotnet restore performs the supported restore responsibilities"
implemented = true
proof = "tests/r08_restore.rs runs real 'dotnet restore HelloFerrum.rsproj' with the repository SDK resolver path and requires standard obj/project.assets.json output. Certified on Linux and Windows by Rust CI #225 at 8cdd02e2d1d0cdf7f06b580b21c5c6ebe8ec369d."

[[contracts]]
id = "FW-R08-SDK-004"
family = "dotnet build produces the managed FerrumWeave assembly"
implemented = true
proof = "tests/r08_build.rs runs real 'dotnet build HelloFerrum.rsproj' through FerrumWeave.Sdk, requires the standard bin/Debug/net10.0/HelloFerrum.dll output, loads that assembly through CLR reflection, and verifies FerrumWeave.RustApi.Answer returns 42. Certified on Linux and Windows by Rust CI #236 and R04 CLR CTS Reflection #131 at 0307a83a2c21276f3894f0a452f129b9a47d6b56."

[[contracts]]
id = "FW-R08-SDK-005"
family = "dotnet run executes the generated Rust project"
implemented = true
proof = "tests/r08_run.rs invokes real 'dotnet run --project HelloFerrum.rsproj' through FerrumWeave.Sdk, requires the managed entry point to execute the Rust source observable 'Hello from FerrumWeave!', and preserves the managed assembly contract. Certified on Linux and Windows by Rust CI #251 and R04 CLR CTS Reflection #146 at 9b19d642f92d0dfe04000c1dc0c48f8311f53bbe."

[[contracts]]
id = "FW-R08-SDK-006"
family = "dotnet clean removes supported build outputs predictably"
implemented = true
proof = "tests/r08_clean.rs performs the supported real build lifecycle, requires bin/Debug/net10.0/HelloFerrum.dll to exist, invokes real 'dotnet clean HelloFerrum.rsproj' through FerrumWeave.Sdk, and requires that managed build artifact to be removed. Certified on Linux and Windows by Rust CI #253 and R04 CLR CTS Reflection #148 at 902a7c53557e3cf4de185a9460f4664487f53fd7."

[[contracts]]
id = "FW-R08-SDK-007"
family = "dotnet test has a documented supported hook or an explicit executable limitation"
implemented = true
proof = "tests/r08_test.rs invokes real 'dotnet test HelloFerrum.rsproj --no-restore' through FerrumWeave.Sdk and requires the SDK-owned VSTest target to fail explicitly with the documented limitation that no Rust test adapter is provided yet. Certified on Linux and Windows by Rust CI #256 and R04 CLR CTS Reflection #151 at e4405558f1e3f89e673c6fcd7ecb2e1b1e47be5f."

