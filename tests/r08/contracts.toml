# R08 makes Rust a first-class SDK-style project in the dotnet toolchain.
# The denominator is declared up front from the roadmap DoD. A contract remains false
# until executable evidence proves the supported behavior on the required platforms.
# 2026-09 backend-convergence audit: the product build contract additionally requires
# .rsproj -> FerrumWeave.Sdk -> rustc -> FerrumWeave CodegenBackend causality; the legacy
# ferrumweave_emit/source-parser path is not valid product evidence.

