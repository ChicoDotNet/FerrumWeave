milestone = "R08"
status = "done"
minimum_percent_when_done = 96.0
target_percent_when_done = 100.0

# R08 makes Rust a first-class SDK-style project in the dotnet toolchain.
# Current product evidence must flow through .rsproj -> FerrumWeave.Sdk -> rustc ->
# FerrumWeave CodegenBackend; historical substitute emitters and external oracle lanes
# are not part of the current evidence tree.

[[contracts]]
id = "FW-R08-SDK-001"
family = "Rust participates in the standard dotnet console template as a language"
implemented = true
proof = "tests/r08_dotnet_new.rs installs sdk/templates/console and requires both 'dotnet new console -lang Rust' and '--language Rust' to generate the expected .rsproj/Rust source while preserving the standard C#, F# and VB console variants."

[[contracts]]
id = "FW-R08-SDK-002"
family = ".rsproj is an SDK-style project owned by FerrumWeave.Sdk"
implemented = true
proof = "The canonical SDK project fixture names FerrumWeave.Sdk as its MSBuild SDK; sdk/FerrumWeave.Sdk/Sdk/Sdk.targets owns Rust compilation and invokes rustc through the FerrumWeave CodegenBackend."

[[contracts]]
id = "FW-R08-SDK-003"
family = "dotnet restore performs the supported restore responsibilities"
implemented = true
proof = "tests/r08_restore.rs runs real 'dotnet restore' through the repository SDK resolver and requires standard obj/project.assets.json output."

[[contracts]]
id = "FW-R08-SDK-004"
family = "dotnet build produces the managed FerrumWeave assembly"
implemented = true
proof = "tests/r08_build.rs runs real 'dotnet build' through FerrumWeave.Sdk and verifies managed output; tests/sdk_backend_path.rs independently proves normal build is causal through rustc and the FerrumWeave CodegenBackend."

[[contracts]]
id = "FW-R08-SDK-005"
family = "dotnet run executes the generated Rust project"
implemented = true
proof = "tests/r08_run.rs exercises the supported run path and requires CoreCLR to execute behavior originating in Rust source through FerrumWeave.Sdk."

[[contracts]]
id = "FW-R08-SDK-006"
family = "dotnet clean removes supported build outputs predictably"
implemented = true
proof = "tests/r08_clean.rs builds through FerrumWeave.Sdk, invokes real 'dotnet clean', and requires the managed build output to be removed."

[[contracts]]
id = "FW-R08-SDK-007"
family = "dotnet test has a documented supported hook or an explicit executable limitation"
implemented = true
proof = "tests/r08_test.rs invokes real 'dotnet test --no-restore' through FerrumWeave.Sdk and requires the current SDK-owned VSTest target to fail explicitly rather than report a false zero-test success."

[[contracts]]
id = "FW-R08-SDK-008"
family = "the project lifecycle requires no bespoke manual build script outside the SDK contract"
implemented = true
proof = "tests/r08_sdk_lifecycle.rs rejects bespoke shell, PowerShell, cmd, batch and Makefile build scripts in the canonical SDK fixture and requires lifecycle ownership in FerrumWeave.Sdk."

[[contracts]]
id = "FW-R08-SDK-009"
family = "the SDK defaults to the current supported stable/LTS .NET line"
implemented = true
proof = "tests/r08_supported_dotnet.rs requires net10.0 and verifies that the certified environment exposes a .NET 10 SDK through 'dotnet --list-sdks'."

[[contracts]]
id = "FW-R08-SDK-010"
family = "the complete supported R08 SDK lifecycle is certified from documented prerequisites on Linux and Windows"
implemented = true
proof = "tests/r08_end_to_end.rs exercises the supported restore/build/run/test/clean lifecycle and tests/sdk_backend_path.rs independently certifies compiler causality inside that SDK boundary."

[[contracts]]
id = "FW-R08-SDK-011"
family = "normal .rsproj compilation causally invokes rustc with the FerrumWeave CodegenBackend rather than a substitute source parser"
implemented = true
proof = "tests/sdk_backend_path.rs requires malformed Rust to fail with a real rustc diagnostic, then mutates only valid Rust source and requires both managed artifact bytes and an independent CoreCLR observable to change."

[[contracts]]
id = "FW-R08-SDK-012"
family = "the legacy ferrumweave_emit source-parser emitter is retired from registered product binaries"
implemented = true
proof = "tests/legacy_emitter_retirement.rs requires compiler/cil/Cargo.toml to contain no ferrumweave_emit binary and requires sdk/FerrumWeave.Sdk/Sdk/Sdk.targets to invoke rustc with the FerrumWeave CodegenBackend."

[[contracts]]
id = "FW-R08-SDK-013"
family = "the legacy source-parser emitter implementation is absent from the current product source tree"
implemented = true
proof = "tests/legacy_emitter_retirement.rs requires compiler/cil/src/bin/ferrumweave_emit.rs to be absent while preserving the SDK-to-FerrumWeave-CodegenBackend path."

[[contracts]]
id = "FW-R08-SDK-014"
family = "the legacy hard-coded R08 PE/CIL emitter implementation is absent from the current product source tree"
implemented = true
proof = "tests/legacy_emitter_retirement.rs requires compiler/cil/src/bin/r08_exec.rs to be absent while preserving clr_probe, autobins=false and the SDK-to-FerrumWeave-CodegenBackend path."
